<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="./css/app.css">
<head>
    <meta charset="UTF-8">
    <title>Books!</title>
</head>
<body>

    <div class="container mt-5 flex-column d-flex gap-3">
        <form class="d-flex">
            <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" id="term">
            <button class="btn btn-outline-success" type="submit" id="search">Search</button>
        </form>
        <select class="form-select" aria-label="Media select" id="entity">
            <option selected value="all">All Media</option>
            <option value="movie">Movie</option>
            <option value="podcast">Podcast</option>
            <option value="music">Music</option>
            <option value="musicVideo">Music Video</option>
            <option value="audiobook">Audiobook</option>
            <option value="shortFilm">Short Film</option>
            <option value="tvShow">TV Show</option>
            <option value="software">Software</option>
            <option value="ebook">eBook</option>
        </select>
        <div id="output"></div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="ajax.js" type="module"></script>
</body>
</html>
